<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CICO2026 Gameplay</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="../shared/match.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="overlay">
        <svg id="background" viewBox="0 0 1920 1080" aria-hidden="true"><defs><mask id="client-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><rect width="1920" height="1080" fill="white"/><g id="cutouts"></g></mask></defs><g mask="url(#client-mask)"><image href="../assets/background.png" width="1920" height="1080"/><g id="client-frames"></g></g></svg>
        <div id="clients"></div>
        <div id="match-ui"></div>
        <div class="score-comparison">
            <div class="score-track"><div class="difference-fill"></div></div>
            <span id="score-gap">—</span>
        </div>
        <div id="toast" class="operator-toast" role="status" hidden></div>
    </main>
    <script src="../shared/interactions.js"></script>
    <script src="../config.js"></script>
    <script src="../deps/reconnecting-websocket.min.js"></script>
    <script src="../deps/countUp.js"></script>
    <script src="../deps/twitch-chat.js"></script>
    <script src="../pool-showcase/map-data.js"></script>
    <script src="../shared/match-data.js"></script>
    <script src="../shared/match-state.js"></script>
    <script src="../shared/match-view.js"></script>
    <script src="../shared/broadcast.js"></script>
    <script src="index.js"></script>
</body>
</html>
